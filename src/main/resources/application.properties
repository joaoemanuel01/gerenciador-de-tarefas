spring.application.name=gerenciador-tarefas

# Banco H2 em memória (os dados são perdidos ao reiniciar a aplicação)
spring.datasource.url=jdbc:h2:mem:tarefasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Erros de validação/JSON inválido tratados pelo GlobalExceptionHandler
server.error.include-message=never
