spring.application.name=gerenciador-tarefas

# Banco H2 em memória (os dados são perdidos ao reiniciar a aplicação)
spring.datasource.url=jdbc:h2:mem:tarefasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Segurança: console do H2 desligado por padrão (para depurar, mude para true)
spring.h2.console.enabled=false

# Segurança: campos desconhecidos no JSON geram 400 em vez de serem ignorados
spring.jackson.deserialization.fail-on-unknown-properties=true

# Nunca expor mensagens internas nem stack traces nas respostas de erro
server.error.include-message=never
server.error.include-stacktrace=never
